spring:
  application:
    name: studypilot-backend
  # ARCH-002 只验证骨架，不在没有 PostgreSQL 的电脑上尝试建立连接。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

studypilot:
  database:
    url: ${STUDYPILOT_DB_URL:}
    username: ${STUDYPILOT_DB_USERNAME:}
    password: ${STUDYPILOT_DB_PASSWORD:}
