server.address=127.0.0.1
server.port=${STUDY_PORT:18080}
spring.datasource.url=${STUDY_DB_URL:jdbc:mysql://127.0.0.1:13306/studypilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${STUDY_DB_USER:study}
spring.datasource.password=${STUDY_DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
spring.web.resources.static-locations=file:frontend/
study.ai=${STUDY_AI:http://127.0.0.1:18081}
study.data=${STUDY_DATA:data}
logging.file.name=logs/java.log
